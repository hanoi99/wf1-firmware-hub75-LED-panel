; WF1 custom LED matrix firmware
; Local development target: Huidu WF1 (ESP32-S2)
;
; Third-party Arduino libraries are vendored in ./lib.
; The ESP32 platform is pinned to the exact tested commit because it supplies
; the framework, compiler integration and board support package.

[platformio]
default_envs = huidu_hd_wf1
src_dir = src
data_dir = data
lib_dir = lib

[env:huidu_hd_wf1]
platform = https://github.com/Jason2866/platform-espressif32.git#66389b3fdfbdc29716b8cddfd80cbf11315af82c
board = esp32-s2-saola-1
board_build.mcu = esp32s2
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
; Falls der Flash knapp wird (kein OTA im Einsatz): partitions_noota.csv verwenden
; (1,9 MB statt 1,25 MB fuer die Firmware).
; board_build.partitions = partitions_noota.csv
build_flags =
    -DWF1=1
